name: Release Smart Road installer

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/build-installer
        id: installer
      - name: Publish release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          SR_VERSION: ${{ steps.installer.outputs.version }}
        run: |
          $files = @(
            "dist/SmartRoad-AutoCAD-2016-v$env:SR_VERSION-Setup.exe"
            "dist/SmartRoad-AutoCAD-2016-v$env:SR_VERSION.zip"
          )
          gh release view $env:TAG 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG @files
          } else {
            gh release create $env:TAG @files --verify-tag --generate-notes
          }
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Release upload failed.' }
