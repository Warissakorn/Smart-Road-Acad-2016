name: Release Smart Road installer

# A push to main releases the manifest version when its tag does not exist yet,
# so bumping AppVersion is enough to publish. Pushing a v* tag still works.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: smart-road-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Decide whether this version needs a release
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version=$(python3 -c "import xml.etree.ElementTree as E; print(E.parse('SmartRoad.bundle/PackageContents.xml').getroot().get('AppVersion'))")
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag=$GITHUB_REF_NAME
            publish=true
          else
            tag=v$version
            if gh api "repos/$GH_REPO/git/ref/tags/$tag" --silent 2>/dev/null; then
              echo "Tag $tag already exists; push a new AppVersion to release again."
              publish=false
            else
              echo "Tag $tag does not exist; releasing $GITHUB_SHA as $tag."
              publish=true
            fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

  release:
    needs: plan
    if: needs.plan.outputs.publish == 'true'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/build-installer
        id: installer
      - name: Publish release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.plan.outputs.tag }}
          SR_VERSION: ${{ steps.installer.outputs.version }}
        run: |
          if ($env:TAG -cne "v$env:SR_VERSION") { throw "Release tag must match the bundle version: v$env:SR_VERSION" }
          $files = @(
            "dist/SmartRoad-AutoCAD-2016-v$env:SR_VERSION-Setup.exe"
            "dist/SmartRoad-AutoCAD-2016-v$env:SR_VERSION.zip"
          )
          $release = gh release view $env:TAG --json assets 2>$null
          if ($LASTEXITCODE -eq 0) {
            $assets = @((ConvertFrom-Json $release).assets)
            foreach ($file in $files) {
              $name = Split-Path -Leaf $file
              $asset = $assets | Where-Object name -CEQ $name
              if ($asset -and $asset.state -eq 'uploaded' -and $asset.size -gt 0) {
                Write-Host "Already published for this tag: $name"
                continue
              }
              if ($asset) {
                gh release upload $env:TAG $file --clobber
              } else {
                gh release upload $env:TAG $file
              }
              if ($LASTEXITCODE -ne 0) { throw "Upload failed for $name" }
            }
          } elseif ($env:GITHUB_REF_TYPE -eq 'tag') {
            gh release create $env:TAG @files --verify-tag --generate-notes
          } else {
            # Creates the tag at the commit that was built and tested.
            gh release create $env:TAG @files --target $env:GITHUB_SHA --generate-notes
          }
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Release upload failed.' }
