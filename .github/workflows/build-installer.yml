name: Build Smart Road installer

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: ./.github/actions/build-installer
        id: installer

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        id: artifacts
        continue-on-error: true
        with:
          name: SmartRoad-AutoCAD-2016-v${{ steps.installer.outputs.version }}
          path: |
            dist/*.exe
            dist/*.zip
          if-no-files-found: error

      - name: Report unavailable artifacts
        if: steps.artifacts.outcome == 'failure'
        shell: pwsh
        run: Write-Output '::warning::Installer and ZIP built and passed Windows tests. The Artifacts upload failed. Check the upload log for the reason. Version tags publish through GitHub Releases directly.'
