name: Build Smart Road installer

on:
  workflow_dispatch:
    inputs:
      upload_artifacts:
        description: Upload EXE and ZIP to Actions Artifacts if storage is available
        type: boolean
        default: false
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: ./.github/actions/build-installer
        id: installer

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: github.event_name == 'workflow_dispatch' && inputs.upload_artifacts
        with:
          name: SmartRoad-AutoCAD-2016-v${{ steps.installer.outputs.version }}
          path: |
            dist/*.exe
            dist/*.zip
          if-no-files-found: error
